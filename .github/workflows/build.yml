name: Build VVebo Fix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -L https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            | tar -xJ -C "$HOME/theos/sdks"

      - name: Install ldid
        run: brew install ldid

      - name: Rewrite control with Unix line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("control").write_text(
          "Package: com.vvebofix.tweak\n"
          "Name: VVebo Fix\n"
          "Depends: mobilesubstrate\n"
          "Version: 1.0.0\n"
          "Architecture: iphoneos-arm\n"
          "Description: Fix VVebo user profile for TrollFools\n"
          "Maintainer: VVeboFix\n"
          "Author: VVeboFix\n"
          "Section: Tweaks\n"
          "Tag: purpose::extension\n",
          newline="\n",
          encoding="utf-8",
          )
          PY

      - name: Build Tweak
        run: make package FINALPACKAGE=1 DEBUG=0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVeboFix-deb
          path: packages/*.deb

name: Build VVebo Fix (Simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-18.04
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make perl curl unzip build-essential
        sudo apt-get install -y libncurses5 libncurses5-dev libtinfo5
        
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        
        # Use system clang instead of custom toolchain
        sudo apt-get install -y clang
        
        # Download iOS SDK only
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/* $HOME/theos/sdks/
        
    - name: Modify Makefile for System Clang
      run: |
        # Create a simplified Makefile that uses system clang
        cat > Makefile << 'EOF'
        ARCHS = arm64
        TARGET := iphone:clang:14.5:14.0
        
        include $(THEOS)/makefiles/common.mk
        
        TWEAK_NAME = VVeboFix
        
        VVeboFix_FILES = Tweak.x
        VVeboFix_CFLAGS = -fobjc-arc
        
        include $(THEOS)/makefiles/tweak.mk
        EOF
        
    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: VVeboFix-deb-simple
        path: packages/*.deb

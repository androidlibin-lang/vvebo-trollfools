name: Build VVebo Fix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Build Environment
      run: |
        apt-get update
        apt-get install -y git make perl curl unzip build-essential
        apt-get install -y libncurses5 libncurses5-dev libtinfo5
        apt-get install -y python3 python3-pip
        
    - name: Setup Theos
      run: |
        # Install Theos
        git clone --recursive https://github.com/theos/theos.git /opt/theos
        export THEOS=/opt/theos
        export PATH=$THEOS/bin:$PATH
        
        # Download compatible toolchain for Ubuntu 18.04
        curl -LO https://github.com/sbingner/llvm-project/releases/download/swift-5.3.2-RELEASE/clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        tar -xf clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        mkdir -p /opt/theos/toolchain/linux/iphone
        mv clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04/* /opt/theos/toolchain/linux/iphone/
        
        # Download iOS SDK
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/* /opt/theos/sdks/
        
    - name: Build Tweak
      run: |
        export THEOS=/opt/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VVeboFix-deb
        path: packages/*.deb
        retention-days: 30

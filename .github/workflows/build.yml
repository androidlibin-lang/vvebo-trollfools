name: Build VVebo Fix (Fast)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Quick Setup
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git make perl curl unzip clang
        
    - name: Setup Minimal Theos
      run: |
        git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
        curl -sL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
        unzip -q sdks.zip
        mv sdks-master/* $HOME/theos/sdks/
        
    - name: Create Simple Build
      run: |
        export THEOS=$HOME/theos
        
        # Create minimal Makefile
        cat > Makefile.simple << 'EOF'
        THEOS_DEVICE_IP = localhost
        ARCHS = arm64
        TARGET = iphone:clang:14.5:14.0
        
        include $(THEOS)/makefiles/common.mk
        
        TWEAK_NAME = VVeboFix
        VVeboFix_FILES = Tweak.x
        VVeboFix_CFLAGS = -fobjc-arc
        
        include $(THEOS)/makefiles/tweak.mk
        EOF
        
        # Build with system tools
        export PATH=$THEOS/bin:$PATH
        make -f Makefile.simple clean
        make -f Makefile.simple package FINALPACKAGE=1
        
    - name: Upload Result
      uses: actions/upload-artifact@v3
      with:
        name: VVeboFix-deb-fast
        path: packages/*.deb
